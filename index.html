<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sisters’ Dresses | Ателье и гардеробный консьерж</title>
<meta name="description" content="Sisters’ Dresses — курортное ателье в Дананге, Вьетнам.">
<meta name="theme-color" content="#14301F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFFFFF; --bg-soft:#F6F2E8; --ink:#14301F; --ink-soft:#54645A; --line:#E3DDCF;
  --gold:#A87C33; --gold-ink:#84601F;
  --promo-bg:#14301F; --promo-ink:#F6F1E4;
  --btn-bg:#14301F; --btn-ink:#F6F1E4;
  --logo-filter:none;
  --serif:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --sans:"Jost","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A13; --bg-soft:#15241A; --ink:#F1ECDF; --ink-soft:#B4BCB0; --line:#2B3B30;
    --gold:#C9A45C; --gold-ink:#D2AE6A;
    --promo-bg:#1D3A28; --promo-ink:#F6F1E4;
    --btn-bg:#E9E1CC; --btn-ink:#14301F;
    --logo-filter:brightness(0) invert(1);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A13; --bg-soft:#15241A; --ink:#F1ECDF; --ink-soft:#B4BCB0; --line:#2B3B30;
  --gold:#C9A45C; --gold-ink:#D2AE6A;
  --promo-bg:#1D3A28; --promo-ink:#F6F1E4;
  --btn-bg:#E9E1CC; --btn-ink:#14301F;
  --logo-filter:brightness(0) invert(1);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
img{max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
ul{list-style:none;margin:0;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--btn-bg);color:var(--btn-ink);padding:10px 16px;z-index:200}
.skip:focus{top:8px}

/* promo bar */
.promo{background:var(--promo-bg);color:var(--promo-ink);text-align:center;font-size:14px;padding:9px 16px;letter-spacing:.02em}
.promo button{margin-left:12px;text-decoration:underline;text-underline-offset:3px}

/* header */
.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:14px clamp(16px,3vw,40px) 10px}
.bar-l,.bar-r{display:flex;align-items:center;gap:18px}
.bar-r{justify-content:flex-end}
.util-l{display:flex;gap:22px;align-items:center;font-size:14px}
.util-l select{font:inherit;color:inherit;background:transparent;border:0;border-bottom:1px solid var(--line);padding:2px 2px}
.util-l select option{color:#14301F}
.brand{display:block;text-decoration:none}
.logo-word{display:block;width:clamp(170px,19vw,240px);aspect-ratio:700/88;background:var(--l-word) center/contain no-repeat;filter:var(--logo-filter)}
.icon{display:inline-grid;place-items:center;width:40px;height:40px;position:relative;border-radius:50%}
.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.icon .count{position:absolute;top:3px;right:1px;min-width:17px;height:17px;border-radius:9px;background:var(--btn-bg);color:var(--btn-ink);font-size:11px;line-height:17px;text-align:center}
.burger{display:none}

/* nav + mega */
.nav{position:relative;border-top:1px solid transparent}
.nav>ul{display:flex;justify-content:center;gap:clamp(18px,2.6vw,40px);padding:0 24px}
.nav-link{display:block;padding:12px 2px 13px;font-size:15px;letter-spacing:.03em;text-decoration:none;border-bottom:1px solid transparent}
.nav-item:hover>.nav-link,.nav-item:focus-within>.nav-link{border-bottom-color:var(--gold)}
.mega{position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 18px 30px -22px rgba(0,0,0,.35);visibility:hidden;opacity:0;transition:opacity .16s ease}
.nav-item:hover>.mega,.nav-item:focus-within>.mega{visibility:visible;opacity:1}
.mega-in{display:flex;gap:clamp(32px,6vw,90px);max-width:1180px;margin:0 auto;padding:30px 32px 36px}
.mega h3{font:600 15px/1.3 var(--sans);margin:0 0 12px;letter-spacing:.02em}
.mega li a{display:block;padding:5px 0;text-decoration:none;color:var(--ink-soft);font-size:15px}
.mega li a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.mega .feat{display:flex;gap:14px;margin-left:auto}
.feat a{display:block;width:150px;text-decoration:none;font-size:14px}
.feat .ph{aspect-ratio:3/4;background:var(--img) var(--pos,50% 25%)/cover;margin-bottom:8px}

/* search */
.search{border-top:1px solid var(--line);padding:14px clamp(16px,3vw,40px);display:flex;gap:12px;align-items:center}
.search[hidden]{display:none}
.search input{flex:1;font:inherit;font-size:17px;padding:10px 2px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink)}

/* hero: one full photo */
.hero{position:relative;isolation:isolate;display:flex;align-items:center;min-height:clamp(560px,calc(100svh - 130px),880px);color:#fff;background:#0A1710}
.hero-bg{position:absolute;inset:0;z-index:-1;background:var(--img) var(--pos,58% 30%)/cover no-repeat}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,12,8,.5),rgba(5,12,8,0) 55%)}
.hero-copy{padding:0 clamp(24px,6vw,96px);max-width:min(640px,62%)}
.hero h1{font:500 clamp(42px,5.6vw,84px)/1.02 var(--serif);margin:0 0 14px;text-shadow:0 2px 28px rgba(0,0,0,.35)}
.hero .sub{font:400 clamp(20px,2vw,28px)/1.25 var(--serif);margin:0 0 30px}
.hero .rule{display:block;width:76px;height:1px;background:#C9A45C;margin:0 0 22px}
.hero-cta{display:inline-flex;align-items:center;gap:12px;color:#fff;text-decoration:none;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.hero-cta svg{width:22px;height:12px;stroke:currentColor;fill:none;stroke-width:1.5}
.hero-cta:hover span{text-decoration:underline;text-underline-offset:6px}

/* rubrics */
.rubrics{display:grid;grid-template-columns:repeat(4,1fr)}
.tile{position:relative;display:block;aspect-ratio:3/4;overflow:hidden;color:#fff;text-decoration:none}
.tile .ph{position:absolute;inset:0;background:var(--img) var(--pos,50% 30%)/cover}
.tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(to top,rgba(8,20,12,.68),rgba(8,20,12,0))}
.tile p{position:absolute;left:0;right:0;bottom:clamp(18px,2.6vw,36px);z-index:2;margin:0;padding:0 14px;text-align:center;text-shadow:0 2px 20px rgba(0,0,0,.35)}
.tile .nm{display:block;font:500 clamp(22px,2.4vw,34px)/1.1 var(--serif)}
.tile .go{display:block;margin-top:10px;font:400 14px/1 var(--sans);letter-spacing:.04em;text-decoration:underline;text-underline-offset:5px}

/* language select */
.lang{font:inherit;font-size:14px;color:inherit;background:transparent;border:1px solid var(--line);padding:7px 6px;margin-right:6px;border-radius:0}
.lang option{color:#14301F}

/* article pages */
.page{padding:clamp(28px,5vw,64px) clamp(20px,5vw,72px) clamp(56px,7vw,110px)}
.page-in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,380px);gap:clamp(32px,6vw,96px);align-items:start}
.prose{max-width:64ch;font-size:18px;line-height:1.75}
.prose .back{display:inline-block;margin-bottom:26px;font-size:15px;color:var(--ink-soft);text-decoration:none}
.prose .back:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.prose h1{font:500 clamp(38px,5vw,64px)/1.05 var(--serif);margin:0 0 30px;outline:none}
.prose h2{font:500 clamp(27px,3vw,36px)/1.15 var(--serif);margin:46px 0 14px}
.prose p{margin:0 0 1.15em}
.prose .sal{font:500 clamp(26px,3vw,34px)/1.2 var(--serif);margin-bottom:22px}
.prose .lines{font-family:var(--serif);font-size:clamp(21px,2.1vw,25px);line-height:1.5;margin:1.4em 0}
.prose .quote{font:500 clamp(28px,3.4vw,42px)/1.2 var(--serif);margin:1.4em 0;padding-left:20px;border-left:2px solid var(--gold)}
.prose .sig{font:500 clamp(24px,2.6vw,30px)/1.35 var(--serif);margin-top:2em}
.prose .more{margin-top:56px;padding-top:22px;border-top:1px solid var(--line)}
.prose .more a{font-size:16px;letter-spacing:.02em;text-underline-offset:5px}
.page-wide{max-width:1100px;margin:0 auto}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:44px 0 0}
.gal .tile{aspect-ratio:4/5}
.names h2{font:500 clamp(28px,3.4vw,40px)/1.1 var(--serif);margin:0 0 20px}
.name-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.name-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;aspect-ratio:3/4;background:var(--bg-soft);text-decoration:none;text-align:center;padding:16px}
.name-card .mono{display:block;width:54px;aspect-ratio:260/267;background:var(--l-mono) center/contain no-repeat;filter:var(--logo-filter)}
.name-card .nm{font:500 clamp(20px,2vw,26px)/1.15 var(--serif)}
.name-card:hover .nm{text-decoration:underline;text-underline-offset:5px}
.fab-banner{position:relative;display:block;aspect-ratio:3/1;overflow:hidden;color:#fff;text-decoration:none;margin-top:12px}
.fab-banner .ph{position:absolute;inset:0;background:var(--img) var(--pos,50% 50%)/cover}
.fab-banner::after{content:"";position:absolute;inset:0;background:rgba(8,20,12,.34)}
.fab-banner p{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:2;margin:0;padding:0 16px;text-align:center;text-shadow:0 2px 22px rgba(0,0,0,.4)}
.fab-banner .nm{display:block;font:500 clamp(26px,4vw,52px)/1.1 var(--serif)}
.fab-banner .go{display:block;margin-top:12px;font:400 14px/1 var(--sans);letter-spacing:.04em;text-decoration:underline;text-underline-offset:5px}
.fab-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:40px}
.fab{display:block;width:100%;aspect-ratio:1;padding:0;border:0;background:none;cursor:zoom-in}
.fab .ph{display:block;width:100%;height:100%;background:var(--img) center/cover}
.fab:hover .ph{opacity:.9}
.lb{position:fixed;inset:0;z-index:120;background:rgba(6,14,9,.97);display:grid;place-items:center;visibility:hidden;opacity:0;transition:opacity .15s}
.lb.on{visibility:visible;opacity:1}
.lb-img{width:min(92vw,78svh,900px);aspect-ratio:1;background:var(--img) center/cover}
.lb-cap{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);margin:0;text-align:center;color:#EFE8D8;font-size:15px}
.lb-x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;color:#fff;z-index:2}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;color:#fff;background:rgba(255,255,255,.14);display:grid;place-items:center;z-index:2}
.lb-nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lb-nav.prev{left:clamp(6px,2vw,28px)}
.lb-nav.next{right:clamp(6px,2vw,28px)}
.pv .price{font:500 clamp(24px,2.6vw,32px)/1.2 var(--serif);margin:1.3em 0 1.3em}
.predict{border-top:1px solid var(--line);padding-top:20px;margin-top:8px}
.predict .pl{font-size:15px;color:var(--ink-soft);margin:0 0 6px}
.predict .pt{font:500 clamp(22px,2.4vw,28px)/1.3 var(--serif);margin:0}
.pv-vh{margin:22px 0 8px;font-size:15px;color:var(--ink-soft)}
.setbox{margin:1.4em 0 1.2em;border-top:1px solid var(--line);padding-top:18px}
.setbox .sh{font:500 clamp(22px,2.4vw,28px)/1.2 var(--serif);margin:0 0 6px}
.setlist{margin:0 0 14px}
.setlist li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:16px;line-height:1.4}
.setlist li span:last-child{font-family:var(--serif);font-size:17px;text-align:right}
.setlist small{display:block;color:var(--gold-ink);font-size:14px}
.crumb{margin:0 0 26px}
.crumb .back{display:inline-block;font-size:15px;color:var(--ink-soft);text-decoration:none}
.crumb .back:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.pv{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(28px,5vw,80px);align-items:start}
.pv-main{aspect-ratio:4/5;background:#fff var(--img) center/contain no-repeat}
.pv-main.cover{background:#fff var(--img) var(--pos,50% 30%)/cover no-repeat}
.pv-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;margin-top:10px}
.pv-thumbs button{aspect-ratio:1;padding:0;border:1px solid var(--line);background:#fff var(--img) center/contain no-repeat}
.pv-thumbs button.cover{background:#fff var(--img) var(--pos,50% 30%)/cover no-repeat}
.pv-thumbs button[aria-current="true"]{outline:2px solid var(--gold);outline-offset:1px}
.page-photo{position:sticky;top:calc(env(safe-area-inset-top,0px) + 150px);aspect-ratio:3/4;background:var(--img) var(--pos,50% 30%)/cover}

/* newsletter */
.news{background:var(--bg-soft);padding:clamp(48px,7vw,90px) 20px;text-align:center}
.news-in{max-width:520px;margin:0 auto}
.news h2{font:500 clamp(30px,4vw,44px)/1.1 var(--serif);margin:0 0 10px}
.news p.lead{margin:0 0 26px;color:var(--ink-soft)}
.form{display:grid;gap:14px;text-align:left}
.field label{display:block;font-size:14px;margin-bottom:5px;color:var(--ink-soft)}
.field input[type=email],.field input[type=date],.field input[type=tel]{width:100%;font:inherit;font-size:16px;padding:12px 14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:0}
.field input:focus{outline:2px solid var(--gold);outline-offset:1px}
.check{display:flex;gap:10px;align-items:center;font-size:15px}
.check input{width:18px;height:18px;accent-color:var(--gold)}
.btn{display:block;width:100%;background:var(--btn-bg);color:var(--btn-ink);padding:14px 20px;font-size:16px;letter-spacing:.04em;text-align:center;text-decoration:none}
.btn:hover{opacity:.92}
.fine{font-size:12.5px;line-height:1.5;color:var(--ink-soft);margin:6px 0 0}
.fine a{text-underline-offset:3px}
.err{color:#B3261E;font-size:14px;min-height:0;margin:0}
:root[data-theme="dark"] .err{color:#FF9C94}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#FF9C94}}
.done{display:none;padding:10px 0}
.done h3{font:500 30px/1.1 var(--serif);margin:0 0 8px}
.code{display:inline-block;margin-top:12px;border:1px dashed var(--gold);padding:10px 22px;font-size:20px;letter-spacing:.14em}
.is-done .form{display:none}
.is-done .done{display:block}

/* footer */
footer{padding:clamp(40px,6vw,72px) clamp(16px,4vw,56px) 28px}
.f-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:clamp(24px,4vw,64px);max-width:1280px;margin:0 auto}
.f-brand .logo-mono{width:78px;aspect-ratio:260/267;background:var(--l-mono) center/contain no-repeat;filter:var(--logo-filter);margin-bottom:14px}
.f-brand p{margin:0 0 6px;color:var(--ink-soft);font-size:15px}
.social{display:inline-flex;align-items:center;gap:10px;margin-top:10px;text-decoration:none;font-size:15px}
.social svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6}
.social:hover span{text-decoration:underline;text-underline-offset:4px}
.fcol summary{list-style:none;cursor:pointer;font:600 16px/1.3 var(--sans);padding:6px 0 12px;display:flex;justify-content:space-between}
.fcol summary::-webkit-details-marker{display:none}
.fcol summary::after{content:"+";font-weight:400;font-size:20px;line-height:1}
.fcol[open] summary::after{content:"–"}
.fcol li a{display:block;padding:5px 0;text-decoration:none;color:var(--ink-soft);font-size:15px}
.fcol li a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.legal{max-width:1280px;margin:36px auto 0;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 26px;font-size:13.5px;color:var(--ink-soft)}
.legal a{text-decoration:none}
.legal a:hover{text-decoration:underline}
.legal .copy-r{margin-left:auto}

/* layers */
.scrim{position:fixed;inset:0;background:rgba(6,14,9,.55);z-index:90;opacity:0;visibility:hidden;transition:opacity .2s}
.scrim.on{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;bottom:0;width:min(420px,92vw);background:var(--bg);z-index:100;padding:calc(env(safe-area-inset-top,0px) + 18px) 22px calc(env(safe-area-inset-bottom,0px) + 22px);overflow:auto;transition:transform .25s ease;visibility:hidden}
.drawer.l{left:0;transform:translateX(-102%)}
.drawer.r{right:0;transform:translateX(102%)}
.drawer.on{transform:none;visibility:visible}
.drawer-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.drawer h2{font:500 28px/1 var(--serif);margin:0}
.mob-nav details{border-bottom:1px solid var(--line)}
.mob-nav summary{list-style:none;cursor:pointer;padding:16px 2px;font-size:17px;display:flex;justify-content:space-between}
.mob-nav summary::-webkit-details-marker{display:none}
.mob-nav summary::after{content:"+";font-size:20px;line-height:1}
.mob-nav details[open] summary::after{content:"–"}
.mob-nav ul{padding:0 2px 14px}
.mob-nav li a{display:block;padding:8px 0;text-decoration:none;color:var(--ink-soft)}
.mob-nav .sub{font:600 14px/1 var(--sans);margin:10px 0 2px;color:var(--ink)}
.empty{color:var(--ink-soft);margin:18px 0 24px}

.modal{position:fixed;inset:0;z-index:110;background:rgba(6,14,9,.55);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);visibility:hidden;opacity:0;transition:opacity .25s}
.modal.on{visibility:visible;opacity:1}
.dialog{position:relative;display:grid;grid-template-columns:.9fr 1.1fr;width:min(820px,100%);max-height:100%;overflow:auto;background:var(--bg);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.dialog .ph{background:var(--i-evening) 50% 30%/cover;min-height:100%}
.dialog .body{padding:clamp(26px,4vw,44px)}
.dialog .logo-mono{width:54px;aspect-ratio:260/267;background:var(--l-mono) center/contain no-repeat;filter:var(--logo-filter);margin-bottom:12px}
.dialog h2{font:500 clamp(30px,4vw,40px)/1.05 var(--serif);margin:0 0 8px}
.dialog .x{position:absolute;top:8px;right:8px;z-index:2;background:var(--bg)}
.link-btn{display:block;width:100%;margin-top:12px;text-align:center;text-decoration:underline;text-underline-offset:4px;color:var(--ink-soft);font-size:15px}
.size-link{background:none;border:0;padding:0;font:inherit;font-size:16px;color:var(--ink);text-decoration:underline;text-underline-offset:5px;cursor:pointer}
.sizes{margin:1.2em 0}
.size-pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.sz{min-width:46px;height:46px;padding:0 14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;letter-spacing:.02em;cursor:pointer}
.sz:hover{border-color:var(--ink)}
.sz[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.add-cart{margin-top:14px}
.cart-item{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.cart-item .ci-ph{width:64px;height:80px;flex:none;background:var(--img) center/cover}
.ci-info{flex:1;min-width:0}

  brand:{
   ru:{h:"Наше вдохновение — Вьетнам",b:[
    ["p","Есть места, в которые приезжаешь путешественником. А есть места, которые однажды становятся домом."],
    ["p","Для нас таким местом стал Вьетнам."],
    ["p","Сначала влюбляешься в то, что видишь: море и горы, старые фасады, фонари, храмы, рынки, цветы у маленьких домов, бесконечную зелень и невероятные сочетания цветов."],
    ["p","А потом — в людей."],
    ["p","В их открытость, трудолюбие, мастерство и удивительную способность создавать красоту своими руками."],
    ["h2","Место, которое объединяет"],
    ["p","Вьетнам становится домом для совершенно разных людей. Кто-то родился здесь, кто-то приехал ненадолго — и остался на годы."],
    ["p","Здесь встречаются разные языки, культуры, характеры и представления о красоте. Наверное, поэтому и герои Sisters’ Dresses такие разные."],
    ["p","Им не нужно быть похожими друг на друга."],
    ["p","Но Вьетнам каким-то удивительным образом умеет соединять всех — с помощью Красоты, Уважения и Человеколюбия."],
    ["h2","Красота как часть жизни"],
    ["p","Здесь красота не существует только для особого случая. Она просто повсюду."],
    ["p","И когда долго живёшь среди неё, однажды понимаешь: тебе уже недостаточно просто смотреть."],
    ["p","Хочется стать её частью."],
    ["p","Для нас одежда стала одним из способов это сделать."],
    ["h2","Сделано во Вьетнаме"],
    ["p","Все мастера и швеи, с которыми мы создаём Sisters’ Dresses, — вьетнамцы."],
    ["p","За каждой вещью стоят не только эскиз и ткань. За ней стоят руки человека, его опыт, терпение и культура ремесла, которая передавалась здесь поколениями."],
    ["p","Вьетнамский шёлк, жемчуг, ткачество, вышивка, ручная работа — это огромное богатство страны."],
    ["p","Нам хочется показать его современным: не копировать национальный костюм и не превращать традицию в музейный экспонат, а позволить ей жить дальше."],
    ["p","Чтобы одежду, созданную здесь, носили в Дананге, Париже, Москве, Нью-Йорке — где угодно."],
    ["p","Потому что красоту вьетнамских материалов и мастерство вьетнамских мастеров достоин увидеть весь мир."],
    ["h2","Наш способ сказать спасибо"],
    ["p","Мы не хотим присваивать красоту Вьетнама. Мы хотим восхищаться ею, бережно к ней прикасаться и говорить о ней с уважением."],
    ["p","Иногда Вьетнам будет сразу виден в наших вещах. Иногда останется только в движении шёлка, оттенке ткани, линии рукава или маленькой детали."],
    ["p","Но он всегда будет внутри Sisters’ Dresses."],
    ["p","Потому что Вьетнам для нас — не просто страна, где мы шьём одежду."],
    ["lines",["Это страна, которая стала домом.","Страна, которая познакомила нас с невероятными людьми.","Страна, в которую мы однажды влюбились — и продолжаем влюбляться каждый день."]],
    ["quote","Sisters’ Dresses — наш способ сказать Вьетнаму спасибо. И рассказать всему миру о нашей любви и восхищении этой страной."]
   ]},
   en:{h:"Our inspiration: Vietnam",b:[
    ["p","There are places you come to as a traveler. And there are places that, one day, become home."],
    ["p","For us, that place is Vietnam."],
    ["p","First you fall in love with what you see: the sea and the mountains, old façades, lanterns, temples, markets, flowers outside small houses, endless green and unbelievable combinations of color."],
    ["p","And then, with the people."],
    ["p","With their openness, their hard work, their skill and their remarkable ability to create beauty with their own hands."],
    ["h2","A place that brings people together"],
    ["p","Vietnam becomes home for very different people. Some were born here; others came for a short while — and stayed for years."],
    ["p","Different languages, cultures, characters and ideas of beauty meet here. Perhaps that is why the women and men of Sisters’ Dresses are so different from one another."],
    ["p","They don’t have to be alike."],
    ["p","But Vietnam, in some remarkable way, brings everyone together — through Beauty, Respect and Humanity."],
    ["h2","Beauty as a part of life"],
    ["p","Here, beauty isn’t saved for special occasions. It is simply everywhere."],
    ["p","And when you live among it for a long time, one day you realize that looking is no longer enough."],
    ["p","You want to become a part of it."],
    ["p","For us, clothing became one way to do that."],
    ["h2","Made in Vietnam"],
    ["p","All the artisans and seamstresses we create Sisters’ Dresses with are Vietnamese."],
    ["p","Behind every piece there is more than a sketch and a fabric. There are a person’s hands, experience and patience, and a culture of craft that has been passed down here for generations."],
    ["p","Vietnamese silk, pearls, weaving, embroidery, handwork — this is an enormous treasure of the country."],
    ["p","We want to show it in a modern way: not to copy the national costume or turn tradition into a museum piece, but to let it live on."],
    ["p","So that clothes made here can be worn in Da Nang, Paris, Moscow, New York — anywhere."],
    ["p","Because the whole world deserves to see the beauty of Vietnamese materials and the skill of Vietnamese artisans."],
    ["h2","Our way of saying thank you"],
    ["p","We don’t want to appropriate the beauty of Vietnam. We want to admire it, touch it with care and speak of it with respect."],
    ["p","Sometimes Vietnam will be visible in our pieces at first glance. Sometimes it will remain only in the movement of the silk, the shade of a fabric, the line of a sleeve or a small detail."],
    ["p","But it will always be inside Sisters’ Dresses."],
    ["p","Because for us, Vietnam is not just the country where we make clothes."],
    ["lines",["It is the country that became home.","The country that introduced us to incredible people.","The country we fell in love with one day — and keep falling in love with every day."]],
    ["quote","Sisters’ Dresses is our way of saying thank you to Vietnam. And of telling the whole world about our love and admiration for this country."]
   ]},
   vi:{h:"Cảm hứng của chúng tôi — Việt Nam",b:[
    ["p","Có những nơi ta đến với tư cách một du khách. Và có những nơi một ngày nào đó trở thành nhà."],
    ["p","Với chúng tôi, nơi ấy là Việt Nam."],
    ["p","Ban đầu ta yêu những gì mình thấy: biển và núi, những mặt tiền cổ, đèn lồng, đền chùa, chợ, hoa trước những ngôi nhà nhỏ, màu xanh bất tận và những sự kết hợp màu sắc khó tin."],
    ["p","Rồi ta yêu con người."],
    ["p","Yêu sự cởi mở, chăm chỉ, tay nghề và khả năng tuyệt vời tạo ra cái đẹp bằng chính đôi tay của họ."],
    ["h2","Nơi kết nối mọi người"],
    ["p","Việt Nam trở thành nhà của những con người rất khác nhau. Có người sinh ra ở đây, có người đến chỉ ít lâu — rồi ở lại nhiều năm."],
    ["p","Nơi đây gặp gỡ nhiều ngôn ngữ, nền văn hóa, tính cách và quan niệm về cái đẹp. Có lẽ vì vậy mà những nhân vật của Sisters’ Dresses cũng rất khác nhau."],
    ["p","Họ không cần phải giống nhau."],
    ["p","Nhưng bằng một cách kỳ diệu nào đó, Việt Nam biết cách kết nối tất cả — bằng Cái đẹp, Sự tôn trọng và Lòng nhân ái."],
    ["h2","Cái đẹp là một phần của cuộc sống"],
    ["p","Ở đây, cái đẹp không chỉ dành cho dịp đặc biệt. Nó có mặt ở khắp nơi."],
    ["p","Và khi sống lâu giữa nó, đến một ngày ta nhận ra: chỉ ngắm nhìn thôi là chưa đủ."],
    ["p","Ta muốn trở thành một phần của nó."],
    ["p","Với chúng tôi, trang phục là một cách để làm điều đó."],
    ["h2","Sản xuất tại Việt Nam"],
    ["p","Tất cả thợ thủ công và thợ may cùng chúng tôi tạo nên Sisters’ Dresses đều là người Việt Nam."],
    ["p","Sau mỗi món đồ không chỉ có bản phác thảo và chất liệu vải. Đó còn là đôi tay, kinh nghiệm và sự kiên nhẫn của một con người, cùng nền văn hóa nghề thủ công được truyền lại qua nhiều thế hệ."],
    ["p","Lụa, ngọc trai, nghề dệt, thêu, những sản phẩm làm thủ công của Việt Nam — đó là kho báu vô cùng lớn của đất nước."],
    ["p","Chúng tôi muốn thể hiện nó theo cách hiện đại: không sao chép quốc phục, không biến truyền thống thành hiện vật bảo tàng, mà để nó tiếp tục sống."],
    ["p","Để trang phục được làm ra ở đây có thể được mặc ở Đà Nẵng, Paris, Moscow, New York — ở bất cứ đâu."],
    ["p","Bởi vẻ đẹp của chất liệu Việt Nam và tay nghề của những nghệ nhân Việt Nam xứng đáng để cả thế giới được nhìn thấy."],
    ["h2","Cách chúng tôi nói lời cảm ơn"],
    ["p","Chúng tôi không muốn chiếm đoạt vẻ đẹp của Việt Nam. Chúng tôi muốn ngưỡng mộ nó, nâng niu chạm vào nó và nói về nó bằng sự tôn trọng."],
    ["p","Đôi khi Việt Nam sẽ hiện ra ngay trong những món đồ của chúng tôi. Đôi khi nó chỉ còn lại trong chuyển động của lụa, sắc độ của vải, đường nét của ống tay áo hay một chi tiết nhỏ."],
    ["p","Nhưng nó sẽ luôn ở bên trong Sisters’ Dresses."],
    ["p","Bởi với chúng tôi, Việt Nam không chỉ là đất nước nơi chúng tôi may quần áo."],
    ["lines",["Đó là đất nước đã trở thành nhà.","Đất nước đã cho chúng tôi gặp gỡ những con người tuyệt vời.","Đất nước mà một ngày chúng tôi đã phải lòng — và mỗi ngày lại tiếp tục yêu thêm."]],
    ["quote","Sisters’ Dresses là cách chúng tôi nói lời cảm ơn với Việt Nam. Và kể với cả thế giới về tình yêu và sự ngưỡng mộ của chúng tôi dành cho đất nước này."]
   ]}
  },
  letter:{
   ru:{h:"Письмо сестре",b:[
    ["sal","Дорогая моя сестра, моя любимая Олечка!"],
    ["p","Я очень по тебе скучаю. И именно поэтому — ради тебя и для тебя — я создала этот бренд одежды. Чтобы ты наконец-то начала нормально одеваться! Шучу :) Чтобы я уже наконец-то делала что хочу, а не то, к чему привыкла."],
    ["p","Я часто вспоминаю детство (старость подкралась). Денег в нашей семье, как ты помнишь, не было. Экономили на одежде. И тебе приходилось носить платья, из которых я уже выросла."],
    ["p","Потом мы повзрослели и начали шить сами. Я придумывала себе свои странные платья «Поезд „Дубай — Грушинский фестиваль“». А ты всегда выбирала что-то более классическое."],
    ["p","Мы росли. Менялись наши вкусы, наши жизни, наши размеры. В какой-то момент мы совсем перестали носить одежду друг друга. Ходили на шоппинг, на неделю моды."],
    ["p","А теперь ты скоро станешь мамой. У тебя будет дочь. У неё уже есть платья и наряды моей дочери (в количестве 50 тонн). И я уже готова шить новые! Хочу, чтобы наши девчонки были окружены не только огромной любовью, но и безграничной красотой!"],
    ["p","Наверное, поэтому мне так хочется создавать одежду, посвящённую тебе. И организовать доставку в любую точку мира."],
    ["lines",["Потому что я очень тебя люблю.","И потому что мне тебя очень не хватает."]],
    ["p","И когда я придумываю новую коллекцию, новую женщину, в каждой я вижу тебя и своих любимых подруг. Пусть вы все будете рядом. Моя Буги, моя Наташа, моя Тома, моя Карина, Настя, Кристина, Лола, Зубчик, Аня, … И все мои любимые девчонки!"],
    ["p","Наверное, поэтому этот бренд и называется Sisters’ Dresses. Для меня сестринство давно стало чем-то большим, чем родство. Я хочу эту теплоту дружбы сохранить и приумножить."],
    ["quote","Женщина женщине — дом."],
    ["p","Мы можем быть совершенно разными. По-разному выглядеть, жить, любить, растить детей, строить карьеру, начинать всё сначала. Нам могут нравиться совершенно разные платья."],
    ["p","Но когда мы рядом друг с другом — мы сильнее. Мы ярче. Мы энергичнее."],
    ["p","Сейчас ты далеко. Но твоя поддержка и твоя сила — при мне!"],
    ["lines",["В каждом платье.","В каждом кимоно.","В каждом шве на брюках.","В каждом кармане."]],
    ["p","В каждой новой вещи, которую я придумываю, будет немножко тебя и наших подруг."],
    ["p","И я очень надеюсь, что совсем скоро ты ко мне прилетишь. Я смогу показать тебе всё это, отдать тебе свои новые платья и снова, как когда-то в детстве, мы будем делить одежду."],
    ["p","Только теперь всё будет наоборот."],
    ["quote","Теперь ты это платье носишь первая."],
    ["sig",["С любовью,","твоя сестра Ирина."]]
   ]},
   en:{h:"A letter to my sister",b:[
    ["sal","My dear sister, my beloved Olechka!"],
    ["p","I miss you so much. And that is exactly why — for you and because of you — I created this clothing brand. So that you would finally start dressing properly! Just kidding :) So that I could finally do what I want, instead of what I’m used to."],
    ["p","I often think about our childhood (old age has crept up on me). There was no money in our family, as you remember. We saved on clothes. And you had to wear dresses I had already outgrown."],
    ["p","Then we grew up and started sewing for ourselves. I dreamed up my own strange dresses, like “The Dubai – Grushinsky Festival Train.” And you always chose something more classic."],
    ["p","We grew. Our tastes changed, our lives changed, our sizes changed. At some point we stopped wearing each other’s clothes altogether. We went shopping, to fashion week."],
    ["p","And now you are about to become a mother. You will have a daughter. She already has dresses and outfits from my daughter (about fifty tons of them). And I am ready to sew new ones! I want our girls to be surrounded not only by enormous love, but by boundless beauty!"],
    ["p","Perhaps that is why I so want to make clothes dedicated to you. And to arrange delivery to any corner of the world."],
    ["lines",["Because I love you very much.","And because I miss you so much."]],
    ["p","And when I dream up a new collection, a new woman, in each one I see you and my beloved friends. May you all be near me. My Bugi, my Natasha, my Toma, my Karina, Nastya, Kristina, Lola, Zubchik, Anya, … and all my beloved girls!"],
    ["p","Perhaps that is why this brand is called Sisters’ Dresses. For me, sisterhood long ago became something more than kinship. I want to keep this warmth of friendship and make it grow."],
    ["quote","Woman to woman — a home."],
    ["p","We can be completely different. We can look different, live differently, love differently, raise children, build careers, start over. We may like completely different dresses."],
    ["p","But when we are next to each other, we are stronger. We are brighter. We are more energetic."],
    ["p","Right now you are far away. But your support and your strength are with me!"],
    ["lines",["In every dress.","In every kimono.","In every seam of every pair of trousers.","In every pocket."]],
    ["p","In every new piece I dream up, there will be a little of you and of our friends."],
    ["p","And I very much hope that very soon you will fly to me. I will be able to show you all of this, give you my new dresses, and, as in childhood, we will share clothes again."],
    ["p","Only now it will be the other way around."],
    ["quote","Now you are the first to wear this dress."],
    ["sig",["With love,","your sister Irina."]]
   ]},
   vi:{h:"Thư gửi em gái",b:[
    ["sal","Em gái thân yêu của chị, Olechka yêu quý nhất!"],
    ["p","Chị nhớ em rất nhiều. Và chính vì vậy — vì em và dành cho em — chị đã tạo ra thương hiệu quần áo này. Để em cuối cùng cũng chịu ăn mặc cho ra hồn! Đùa thôi :) Để cuối cùng chị được làm điều chị muốn, thay vì những điều chị đã quen."],
    ["p","Chị hay nhớ về thời thơ ấu (tuổi già đã lặng lẽ tìm đến rồi). Nhà mình không có tiền, em còn nhớ chứ. Cái gì cũng phải tiết kiệm, kể cả quần áo. Và em phải mặc những chiếc váy mà chị đã lớn không mặc vừa nữa."],
    ["p","Rồi chúng ta lớn lên và bắt đầu tự may đồ. Chị nghĩ ra cho mình những chiếc váy kỳ quặc, như “Chuyến tàu Dubai – lễ hội Grushinsky”. Còn em luôn chọn những thứ cổ điển hơn."],
    ["p","Chúng ta lớn lên. Gu thẩm mỹ, cuộc sống, số đo của chúng ta đều thay đổi. Đến một lúc nào đó, chúng ta hoàn toàn thôi mặc đồ của nhau. Chúng ta đi mua sắm, đi xem tuần lễ thời trang."],
    ["p","Và giờ đây em sắp làm mẹ. Em sẽ có một cô con gái. Con bé đã có sẵn váy áo của con gái chị (cỡ chừng 50 tấn). Và chị đã sẵn sàng may thêm những chiếc mới! Chị muốn các bé gái của chúng ta được bao bọc không chỉ bởi tình yêu thương to lớn, mà còn bởi vẻ đẹp vô bờ bến!"],
    ["p","Có lẽ vì thế mà chị rất muốn tạo ra những bộ trang phục dành tặng em. Và tổ chức giao hàng đến bất cứ nơi nào trên thế giới."],
    ["lines",["Vì chị rất yêu em.","Và vì chị nhớ em rất nhiều."]],
    ["p","Và khi chị nghĩ ra một bộ sưu tập mới, một người phụ nữ mới, trong mỗi người chị đều thấy em và những người bạn thân yêu của chị. Mong tất cả các em luôn ở bên chị. Bugi của chị, Natasha của chị, Toma của chị, Karina, Nastya, Kristina, Lola, Zubchik, Anya, … Và tất cả những cô gái thân yêu của chị!"],
    ["p","Có lẽ vì thế mà thương hiệu này mang tên Sisters’ Dresses. Với chị, tình chị em từ lâu đã trở thành điều gì đó lớn hơn quan hệ ruột thịt. Chị muốn gìn giữ và làm cho hơi ấm của tình bạn ấy ngày một nhiều thêm."],
    ["quote","Phụ nữ là mái nhà của phụ nữ."],
    ["p","Chúng ta có thể hoàn toàn khác nhau. Khác nhau về vẻ ngoài, cách sống, cách yêu, cách nuôi con, xây dựng sự nghiệp, hay bắt đầu lại từ đầu. Chúng ta có thể thích những chiếc váy hoàn toàn khác nhau."],
    ["p","Nhưng khi ở bên nhau, chúng ta mạnh mẽ hơn. Rực rỡ hơn. Tràn đầy năng lượng hơn."],
    ["p","Bây giờ em ở xa. Nhưng sự ủng hộ và sức mạnh của em luôn ở bên chị!"],
    ["lines",["Trong từng chiếc váy.","Trong từng chiếc kimono.","Trong từng đường may trên quần.","Trong từng chiếc túi."]],
    ["p","Trong mỗi món đồ mới chị nghĩ ra sẽ có một chút của em và của những người bạn chúng ta."],
    ["p","Và chị rất hy vọng rằng rất sớm thôi em sẽ bay đến chỗ chị. Chị sẽ cho em xem tất cả những điều này, tặng em những chiếc váy mới của chị, và như thuở nhỏ, chúng ta lại chia nhau quần áo."],
    ["p","Chỉ là bây giờ mọi thứ sẽ ngược lại."],
    ["quote","Bây giờ em là người mặc chiếc váy này trước."],
    ["sig",["Với tình yêu thương,","chị gái của em, Irina."]]
   ]}
  }

  document.addEventListener("click",function(e){

    if(el.closest("[data-lbn]")){moveLb(+el.closest("[data-lbn]").getAttribute("data-lbn"));return}

      addToCart(acb.getAttribute("data-add-cart"),szsel.getAttribute("data-size"));

    var crm=el.closest("[data-cart-rm]");
    if(crm){cart.splice(+crm.getAttribute("data-cart-rm"),1);saveCart();renderCart();return}
    var o=el.closest("[data-open]");
    if(o){e.preventDefault();openLayer($("#"+o.getAttribute("data-open")));return}
    if(el===$("#pop")){closeLayer();return}
    if(el.closest("[data-close]")){closeLayer();return}
    if(el.closest("[data-pop]")){
      e.preventDefault();
      var goSignup=function(){var s=$("#signup");if(s)s.scrollIntoView({behavior:"smooth",block:"start"})};
      if(cur){location.hash="#top";setTimeout(goSignup,50)}else{goSignup()}
      return;
    }
    var sb=el.closest("[data-soon-btn]");
    if(sb){toast(t(sb.getAttribute("data-soon-btn")));return}
    if(el.closest('a[href^="#/"]')&&openEl&&openEl.id==="menu")closeLayer(true);
    if(el.closest("[data-soon]")){
      e.preventDefault();
      if(openEl&&openEl.id==="menu")closeLayer(true);
      toast(t("toast_soon"));return;
    }
  });

  /* search */
  var sbx=$("#searchbox"),q=$("#q");
  $$("[data-search]").forEach(function(b){b.addEventListener("click",function(){
    sbx.hidden=!sbx.hidden;if(!sbx.hidden)q.focus();
  })});
  q.addEventListener("keydown",function(e){if(e.key==="Enter"&&q.value.trim()){toast(t("toast_search"))}});

  /* forms */
  function bindForm(formId,emailId,errId,boxSel){
    var f=$("#"+formId);
    f.addEventListener("submit",function(e){
      e.preventDefault();
      var em=$("#"+emailId).value.trim(),er=$("#"+errId);
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){er.textContent=t("err_email");$("#"+emailId).focus();return}
      er.textContent="";
      $(boxSel).classList.add("is-done");
      var d=$(".done",$(boxSel));if(d){d.setAttribute("tabindex","-1");d.focus()}
    });
  }
  bindForm("newsform","n-email","n-err","#newsbox");
  bindForm("popform","p-email","p-err","#popbox");
  var sms=$("#n-sms"),pw=$("#n-phone-wrap");
  sms.addEventListener("change",function(){pw.hidden=!sms.checked;if(sms.checked)$("#n-phone").focus()});

  /* footer accordions: open on desktop */
  var mq=window.matchMedia("(min-width:1001px)");
  function syncFooter(){$$(".fcol").forEach(function(d){if(mq.matches)d.setAttribute("open","");else d.removeAttribute("open")})}
  syncFooter();
  if(mq.addEventListener)mq.addEventListener("change",syncFooter);

  window.addEventListener("hashchange",route);
  route();
})();

</script>
</body>
</html>
